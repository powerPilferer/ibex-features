<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Poppins:wght@600&display=swap">
<!-- 특장점(_확정-v31)과 같은 Pretendard 소스 — 합칠 때 한 줄로 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="icon" href="data:,">
<style>
/* ibex 상단(01 산소 ON · 02 브랜드 문장 · 03 이젠, 산소의 시간) — 춘봉 2026-10-16 1차
   좌표 = 피그마 332:29491(1920×3204) 그대로. 무대는 특장점과 같은 1920×1080 cover 스케일(--k), 그 안의 .world 가 세로 4284px 세계.
   모든 움직임은 JS 가 transform/opacity 만 쓴다. 무JS·?motion=0·reduce = 피그마 정지 레이아웃(긴 한 장). */
:root {
  --k: 1;          /* 무대 cover 배율 */
  --kw: 1;         /* 폭 배율(GNB·플로팅) */
  --ice: #AEC8E1;  /* 특장점 바탕 = 피그마 상단 맨 아래 행 (174,200,225) */
  --ink: #fff;
  --dot: #4180BC;  /* GNB 로고 i 점 (피그마 실측) */
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #2B79C8; }
body { overflow-x: clip; -webkit-font-smoothing: antialiased; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
img { display: block; }

/* ---------- GNB 332:29522 (0,0 1920×75, padding 24 48, justify-between) — 메뉴 Poppins SemiBold 15/25, 자간 1.59px, gap 59 ---------- */
.gnb { position: fixed; z-index: 20; left: 0; top: 0; width: 100%; height: calc(75px * var(--kw)); pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; padding: calc(24px * var(--kw)) calc(48px * var(--kw)) 0; }
.gnb a { pointer-events: auto; }
.gnb__logo { display: block; width: calc(72px * var(--kw)); height: calc(27px * var(--kw)); }
.gnb__logo img { display: block; width: 100%; height: 100%; }
.gnb__nav { display: flex; gap: calc(59px * var(--kw)); }
.gnb__nav a { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: calc(15px * var(--kw)); line-height: calc(25px * var(--kw)); letter-spacing: calc(1.59px * var(--kw)); margin-right: calc(-1.59px * var(--kw)); color: var(--ink); text-decoration: none; transition: opacity 180ms cubic-bezier(.4,0,.2,1); }
.gnb__nav a:hover { opacity: .72; }
.gnb a:focus-visible, .quick a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 2px; }

/* ---------- 오른쪽 플로팅 332:29557 (1792,485 82×263): bg #538ccf, 테두리 1px 흰 10%, 알약, padding 24 0, 항목 gap 24 / 아이콘·라벨 gap 12 ---------- */
.quick { position: fixed; z-index: 20; left: calc(1792px * var(--kw)); top: calc(485px * var(--kw)); width: calc(82px * var(--kw)); height: calc(263px * var(--kw));
  border-radius: 999px; background: #538ccf; border: 1px solid rgba(255,255,255,.1);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(24px * var(--kw)); gap: calc(31.5px * var(--kw)); }   /* 스펙 gap 24 + FA 글리프 상자(19.5)로는 항목 간격이 79.5 가 안 나와 export 실측(아이콘 윗선 510·589·669)에 맞춤 */
.quick__item { display: flex; flex-direction: column; align-items: center; gap: calc(12px * var(--kw)); color: #fff; text-decoration: none; transition: opacity 180ms cubic-bezier(.4,0,.2,1); }
.quick__item:hover { opacity: .78; }
.quick__ico { display: block; overflow: visible; margin: 0 !important; }
.quick__item > svg { height: calc(21px * var(--kw)); }   /* 글리프 20·24px 를 line-height 19.5 상자에 — 위아래로 넘침(피그마와 같음) */
.quick__item span { font-size: calc(13px * var(--kw)); line-height: 1; font-weight: 600; white-space: nowrap; }

/* ---------- 무대 ---------- */
.track { position: relative; height: 1100vh; }
.stage { position: sticky; top: 0; height: 100vh; overflow: hidden; background: #2B79C8; }
.view { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden;
  transform: translate(-50%, -50%) scale(var(--k)); transform-origin: 50% 50%;
  opacity: 0; transition: opacity 600ms cubic-bezier(.4,0,.2,1); }
html.is-ready .view { opacity: 1; }
.world { position: absolute; left: 0; top: 0; width: 1920px; height: 4284px; }
.world > * { position: absolute; }
.lyr { pointer-events: none; user-select: none; will-change: transform; }

/* 하늘: 1×4284 세로 띠(0~3203 피그마 실측 행 + 3204~ 특장점 sky-base 행) */
.sky { left: 0; top: 0; width: 1920px; height: 4284px; background: url(assets/sky-col.png) 0 0 / 100% 100% no-repeat; will-change: transform; }
.dots { opacity: .54; filter: blur(1.5px); }   /* 피그마는 흰 점 40% soft-light 지만 브라우저 soft-light 는 붉게 뜸(초과 R:G:B 20.6:17:7 vs 피그마 13:21:12.5) → 실측 점 색 일반 합성으로 */
.ellipse { pointer-events: none; display: none; }   /* 피그마 자리 그대로 두면 영상 리본(피그마 정지 리본보다 좁음) 아래로 갈색 덩어리가 드러남 → 기본 끔, ?ell=1 로 켬 */
html.ell-on .ellipse { display: block; }
.model { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 60px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 60px), transparent); }
.arcs { left: 0; top: 3204px; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
.arcs img { position: absolute; display: block; }

/* 리본: 바깥 = 카메라·막(어깨 기준 확대) / 안 = 영상 프레임 → 피그마 리본 자리 맞춤 — 제약: 어깨 아랫선을 덮고(세 프레임) 브랜드 문장과 안 겹침 → 회전 −12°·배율 1.35, IoU .59 */
.ribbon { left: 0; top: 0; width: 1920px; height: 3204px; pointer-events: none; transform-origin: 1880px 1120px; will-change: transform; }
.ribbon__fit { position: absolute; left: 515px; top: 667px; width: 1920px; height: 1002px;   /* 기본값 = v2(1920×1002). 실제 상자·색 필터는 js/top.js 리본 설정이 씀 */
  transform-origin: 1101.84px 639.52px; transform: rotate(-12deg) scale(1.35); }
html.rib-raw .ribbon__fit { filter: none; }
.ribbon__fit > * { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.ribbon__video { opacity: 0; transition: opacity 400ms cubic-bezier(.4,0,.2,1); object-fit: fill; }
.ribbon.is-playing .ribbon__video { opacity: 1; }
.ribbon.is-playing .ribbon__poster { visibility: hidden; transition: visibility 0s 400ms; }

/* ---------- 글자 (피그마 get_design_context) ---------- */
.copy { margin: 0; color: var(--ink); font-weight: 700; will-change: transform; }
.copy__line { display: block; will-change: opacity, transform; }
/* 히어로 332:29537 (318,404 318×207): "산소 " Pretendard Bold 87.678 / "ON," Outfit SemiBold, 행간 96.463, 자간 −2.5251, 그룹 drop-shadow 0 0 2px .25 */
.copy--hero { left: 318px; top: 404px; width: 318px; height: 207px; font-size: 87.678px; line-height: 96.463px; letter-spacing: -2.5251px; white-space: nowrap; filter: drop-shadow(0 0 2px rgba(0,0,0,.25)); }
.hero__en { font-family: 'Outfit', sans-serif; font-weight: 600; }
.copy__line--logo { position: absolute; left: 10px; top: 112px; }
.copy__line--logo img { display: block; width: 209.134px; height: 79.787px; }
/* 문장 332:29554 (328,1346): Pretendard Bold 36 / 1.5, 자간 −0.5, 그림자 0 0 4px .25 */
.copy--brand { left: 328px; top: 1346px; font-size: 36px; line-height: 1.5; letter-spacing: -.5px; text-shadow: 0 0 4px rgba(0,0,0,.25); }
/* 이젠 332:29555 (960,2226): Pretendard Bold 87 / 1.2, 자간 −2.88, 그림자 0 0 4px .25 */
.copy--now { left: 960px; top: 2226px; font-size: 87px; line-height: 1.2; letter-spacing: -2.88px; text-shadow: 0 0 4px rgba(0,0,0,.25); }
.copy--oxygen { top: 3700px; left: 0; width: 1920px; text-align: center; }
.copy--oxygen p { margin: 0; }
.ox__title { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 68px; line-height: 98px; letter-spacing: -2.88px; }
.ox__sub { margin-top: 22px !important; font-weight: 600; font-size: 24px; line-height: 38px; }
.ox__body { margin-top: 22px !important; font-weight: 600; font-size: 18px; line-height: 27px; letter-spacing: -0.5px; }

/* 모션 판: 등장 전 상태는 JS 가 첫 프레임에 쓴다(무JS 는 정지판) */
html.has-motion .copy__line, html.has-motion .copy--oxygen > p { opacity: 0; }

/* ---------- 정지판(?motion=0 · reduce · 무JS): 피그마 긴 한 장 그대로 ---------- */
html.no-motion .track { height: auto !important; }
html.no-motion .stage { position: relative; height: calc(3204px * var(--kw)); }
html.no-motion .view { left: 0; top: 0; height: 3204px; transform: scale(var(--kw)); transform-origin: 0 0; opacity: 1; transition: none; }
html.no-motion .world { height: 3204px; }
html.no-motion .arcs, html.no-motion .copy--oxygen, html.no-motion .ribbon__video { display: none; }

@media (prefers-reduced-motion: reduce) {
  .view { transition: none; }
}

</style>
<noscript><style>.view{opacity:1}.copy__line{opacity:1}</style></noscript>
</head>

<!-- 오른쪽 플로팅(332:29557). 피그마 아이콘 = Font Awesome 7 Pro(유료) hospitals / Brands instagram / Pro square-question → Free 대응: hospital / instagram / square+question 합성 (CC BY 4.0) -->
<aside class="quick" aria-label="바로가기">
  <a href="#find" class="quick__item"><svg class="quick__ico" viewBox="0 0 576 512" style="width:calc(22.5px*var(--kw));height:calc(20px*var(--kw))" aria-hidden="true"><path fill="currentColor" d="M128 64c0-35.3 28.7-64 64-64L384 0c35.3 0 64 28.7 64 64l0 64 64 0c35.3 0 64 28.7 64 64l0 256c0 35.3-28.7 64-64 64L64 512c-35.3 0-64-28.7-64-64L0 192c0-35.3 28.7-64 64-64l64 0 0-64zM272 352c-17.7 0-32 14.3-32 32l0 80 96 0 0-80c0-17.7-14.3-32-32-32l-32 0zM128 368l0-32c0-8.8-7.2-16-16-16l-32 0c-8.8 0-16 7.2-16 16l0 32c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16zM112 256c8.8 0 16-7.2 16-16l0-32c0-8.8-7.2-16-16-16l-32 0c-8.8 0-16 7.2-16 16l0 32c0 8.8 7.2 16 16 16l32 0zM512 368l0-32c0-8.8-7.2-16-16-16l-32 0c-8.8 0-16 7.2-16 16l0 32c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16zM496 256c8.8 0 16-7.2 16-16l0-32c0-8.8-7.2-16-16-16l-32 0c-8.8 0-16 7.2-16 16l0 32c0 8.8 7.2 16 16 16l32 0zM264 104l0 32-32 0c-8.8 0-16 7.2-16 16l0 16c0 8.8 7.2 16 16 16l32 0 0 32c0 8.8 7.2 16 16 16l16 0c8.8 0 16-7.2 16-16l0-32 32 0c8.8 0 16-7.2 16-16l0-16c0-8.8-7.2-16-16-16l-32 0 0-32c0-8.8-7.2-16-16-16l-16 0c-8.8 0-16 7.2-16 16z"/></svg><span>병원찾기</span></a>
  <a href="#instagram" class="quick__item"><svg class="quick__ico" viewBox="0 0 448 512" style="width:calc(21px*var(--kw));height:calc(24px*var(--kw))" aria-hidden="true"><path fill="currentColor" d="M224.3 141a115 115 0 1 0 -.6 230 115 115 0 1 0 .6-230zm-.6 40.4a74.6 74.6 0 1 1 .6 149.2 74.6 74.6 0 1 1 -.6-149.2zm93.4-45.1a26.8 26.8 0 1 1 53.6 0 26.8 26.8 0 1 1 -53.6 0zm129.7 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM399 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg><span>인스타그램</span></a>

<main id="top">
<!-- 스크롤 트랙: JS 가 높이를 세운다. 무대는 sticky 100vh, 1920×1080 cover 스케일(특장점과 같은 좌표계).
     카메라 cam = 세로 4284px 세계(상단 0~3204 + 특장점 첫 화면 3204~4284) 위 창의 윗변. 레이어마다 깊이 d 로 따로 움직인다. -->
<div class="track" id="track">
  <div class="stage" id="stage">
    <div class="view" id="view">
      <div class="world" id="world">

        <div class="sky" id="sky" aria-hidden="true"></div>
        <img class="lyr cloud cloud--tl" id="cloudTL" src="assets/cloud-tl.webp" alt="" style="left:0;top:0;width:640px;height:302px">
        <img class="lyr cloud cloud--tr" id="cloudTR" src="assets/cloud-tr.webp" alt="" style="left:1743px;top:0;width:177px;height:106px">

        <!-- 다리(03→04): 특장점 OXYGEN 첫 화면의 호 1·2 — 구름 뒤에서 떠올라 구름이 걷히며 드러난다. 좌표 = 특장점 MEAS + 3204 -->
        <div class="arcs" id="arcs" aria-hidden="true"></div>

        <img class="lyr cloud cloud--bottom" id="cloudB" src="assets/cloud-bottom.webp" alt="" style="left:0;top:1930px;width:1920px;height:1594px">

        <!-- 왼쪽 도트: 피그마 벡터 332:29546(점 1109개) 그대로 — 흰 점, 불투명 40%, 블러 1.5, soft-light. 자리는 export 와 상관 맞춤(−458,440). 로드 때 점마다 가운데에서 바깥 순서로 커지며 번짐 -->
        <canvas class="lyr dots" id="dots" width="1058" height="1056" style="left:-458px;top:440px;width:1058px;height:1056px"></canvas>
        <!-- Ellipse 1(332:29568): #B4988A 타원 블러 50 — 어깨 아래 몸의 그늘. 박스 1078.2,1189.2 929.9×361.9, svg 는 블러 여유 inset −31.28%/−10.92% -->
        <img class="lyr ellipse" id="ellipse" src="assets/ellipse1.svg" alt="" style="left:976.66px;top:1076.0px;width:1132.98px;height:588.32px">
        <!-- 모델: 피그마 F-1(332:29520) 원본 누끼 1429×2000 을 좌우 반전해 1062×1486 @865,−234 (피그마 배치와 템플릿 일치 .979). 아래 끝 1252 는 리본 뒤 — 60px 깃털 -->

        <div class="ribbon" id="ribbon" aria-hidden="true">
          <div class="ribbon__fit" id="ribbonFit">
            <img class="ribbon__poster" id="ribbonPoster" src="assets/ribbon/v2/ribbon-v2-exact-poster.webp" alt="">
            <video class="ribbon__video" id="ribbonVideo" muted loop playsinline preload="auto" disablepictureinpicture></video>
          </div>
        </div>

        <!-- 01 -->
        <h1 class="copy copy--hero" id="copyHero">
          <span class="copy__line"><span class="hero__ko">산소 </span><span class="hero__en">ON,</span></span>
          <span class="copy__line copy__line--logo"><img src="assets/logo-hero.svg" alt="ibex" width="209" height="80"></span>
        </h1>

        <p class="copy copy--brand" id="copyBrand">
          <span class="copy__line">아이벡스는</span>
          <span class="copy__line">대기압보다 높은 압력으로</span>

          <span class="copy__line">몸속 깊은 곳까지 전달합니다.</span>

        <h2 class="copy copy--now" id="copyNow">

        <div class="copy copy--oxygen" id="copyOxygen" aria-hidden="true">
          <p class="ox__title">OXYGEN ON</p>
          <p class="ox__sub">챔버 안을 채우는 의료용 산소</p>
          <p class="ox__body">가동 시작부터 의료용 산소로 채워지고,<br>공급된 산소가 챔버 내부의 압력을 올립니다.<br>산소 농도와 압력은 실시간으로 모니터링됩니다.</p>
        </div>

      </div>
    </div>
  </div>
</div>

      let g = noMotion ? 1 : quartOut((tl - I[0] - d.k * I[1]) / I[2]);   // 인트로: 승인된 번짐 중심('+' 교차점) 그대로
      if (g < 1) all = false;
      if (DOTW === 8 && !noMotion) g *= DP.floor + (1 - DP.floor) * dotWave(tl, d.kw);
      if (g <= 0) continue;
      // 7차(사장님 '배경에 묻힌 패턴도 반복 모션'): 인트로가 끝난 점부터 무늬 중심 → 바깥으로 숨결 물결이 계속 지나간다(점이 살짝 작아졌다 돌아옴). ?dotw=0 끔
      if (DW.on && !noMotion) { const ph = (tl - DW.t0) / DW.period - d.k * DW.waves, w = .5 - .5 * Math.cos(2 * Math.PI * ph);
        g *= 1 - DW.amp * w * Math.min(1, Math.max(0, (tl - DW.t0) / 1.5)); }
      // 피그마 노드는 좌우 반전 배치(metadata x 596 = 반전 원점, 596 − 1050 − 인셋 4 = −458 = 실측 자리) → x' = 1058 − x
      dctx.setTransform(-s * g, 0, 0, s * g, s * (1058 - d.cx * (1 - g)), s * d.cy * (1 - g));
      dctx.fill(d.p);
    }
    DOTS.done = all;
  }
  // 8차: 움직이는 판은 dots-split.json — 피그마에서 붙어 한 경로가 된 점 덩어리(가운데 원판·좌우 호 등 5개)를 격자 점으로 되살린 것(IoU .88~.94, 도구/split_dot_clusters.py).
  //   덩어리째 커졌다 작아지면 큰 조각이 통째로 튄다. 정지판(?motion=0)·?dotw=0/7 은 피그마 원본 그대로.
  const dotsReady = fetch(!noMotion && DOTW === 8 ? 'assets/dots-split.json' : 'assets/dots-vector.json').then(r => r.json()).then(J => {
    const OX = 728, OY = 420;   // 인트로 번짐 중심 = 보이는 무늬의 '+' 교차점(세계 270,860) — 승인된 인트로 그대로
    const WX = 529, WY = 528;   // 8차 파동 중심 = 무늬 동심원의 진짜 중심(점 1106개 중심·격자점, 세계 71,968). 다른 데서 퍼지면 띠가 고리를 가로질러 초승달로 깨진다
    const R = Math.max(...J.paths.map(([, cx, cy]) => Math.hypot((1058 - cx) - OX, cy - OY)));
    const RW = Math.max(...J.paths.map(([, cx, cy]) => Math.hypot((1058 - cx) - WX, cy - WY)));
    DOTS.paths = J.paths.map(([d, cx, cy]) => ({ p: new Path2D(d), cx, cy, k: Math.hypot((1058 - cx) - OX, cy - OY) / R, kw: Math.hypot((1058 - cx) - WX, cy - WY) / RW }));
    if (noMotion) drawDots(99);
  });

  const ready = () => document.documentElement.classList.add('is-ready');
  if (noMotion) { dotsReady.then(ready); window.__top = { noMotion: true }; return; }

  /* ---------- 트랙 ---------- */
  // 8차 카메라: 장면 지점 (Pk, Ck) 를 지나는 3차 Hermite. 평균 기울기 R(세계 px / vh) = camRate·1080 이 모든 구간에서 같고,
  //   지점 기울기 = 시작 1·R(첫 휠부터 움직임) · 02·03 camH·R · 끝 camEnd·R. 단조(기울기 ≤ 3R) → 어디서나 속도 > 0, 멈춤 없음.
  //   마지막 구간(다리)만 길이를 평균 기울기 = (시작 + 끝)/2 로 잡는다 → 속도가 다리 내내 곧게 줄어 특장점 첫 화면에 내려앉는다(중간 불룩 없음).
  const R = M.camRate * H, CK = M.cam;
  const MK = [1, M.camH, M.camH, M.camEnd].map(m => m * R);
  const PK = [0]; for (let i = 1; i < CK.length; i++) PK.push(PK[i - 1] + (CK[i] - CK[i - 1]) / (i === CK.length - 1 ? (MK[i - 1] + MK[i]) / 2 : R));
  const PMAX = PK[PK.length - 1];
  $('track').style.height = (PMAX + 1) * 100 + 'vh';
  function camAt(p) {
    p = clamp(p, 0, PMAX);
    let i = 0; while (i < PK.length - 2 && p > PK[i + 1]) i++;
    const h = PK[i + 1] - PK[i], t = (p - PK[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * CK[i] + (t3 - 2 * t2 + t) * h * MK[i] + (-2 * t3 + 3 * t2) * CK[i + 1] + (t3 - t2) * h * MK[i + 1];
  }
  // 깊이 섞기: 창 [c0,c1] 에서 깊이 d0 → d1(smoothstep). 누적 이동량 D(c) = ∫ d. 화면 y 이동 = −A − (D(cam) − D(A)) → cam = A 에서 피그마 자리
  const Jss = t => t <= 0 ? 0 : t >= 1 ? t - .5 : t * t * t - t * t * t * t / 2;
  const Dint = (c, d0, d1, c0, c1) => d0 * c + (d1 - d0) * (c1 - c0) * Jss((c - c0) / (c1 - c0));
  const parB = (cam, A, d0, d1, w) => -A - (Dint(cam, d0, d1, w[0], w[1]) - Dint(A, d0, d1, w[0], w[1]));
  const camU = (cam, a, b) => clamp((cam - a) / (b - a), 0, 1);

  const L = { ell: $('ellipse'), sky: $('sky'), cTL: $('cloudTL'), cTR: $('cloudTR'), cB: $('cloudB'), dots: $('dots'), model: $('model'), hero: $('copyHero'), brand: $('copyBrand'), now: $('copyNow'), ox: $('copyOxygen') };
  const lines = el => Array.from(el.querySelectorAll('.copy__line, :scope > p'));
  const T = { hero: lines(L.hero), brand: lines(L.brand), now: lines(L.now), ox: lines(L.ox) };
  const gate = { brand: null, now: null, ox: null };
  T.brand.forEach(el => { el.style.opacity = '1'; });   // 4차: 문장은 줄 순차 대신 커튼 경계 마스크로 드러남
  const fix = v => v.toFixed(2);
  const ty = (el, y, extra = '') => { el.style.transform = `translate3d(0,${fix(y)}px,0)${extra}`; };
  // 레이어 화면 이동량: (A, d) → translateY = −A − (cam − A)·d
  const par = (cam, A, d) => -A - (cam - A) * d;

  // 줄 순차 등장(특장점 setText 문법): 창 p 가 열린 순간 시각을 잡고, 줄 k 는 k·gap 뒤 ramp 동안. 창이 닫히면 리셋(되감기)
  function seqText(key, list, open, now, outF) {
    if (open && gate[key] === null) gate[key] = now;
    if (!open) gate[key] = null;
    const t0 = gate[key];
    list.forEach((el, k) => {
      const e = t0 === null ? 0 : quartOut((now - t0 - k * M.text.gap) / M.text.ramp);
      el.style.opacity = (e * outF).toFixed(3);
      el.style.transform = `translate3d(0,${fix((1 - e) * M.text.rise)}px,0)`;
    });
  }

  /* ---------- 커튼 자세 · 문장 드러냄 ---------- */
  const RO = [1880, 1120];                     // 바깥 자세 기준점 = 어깨(.ribbon transform-origin)
  // 8차: 물러남(k)·위로 빠짐(깊이 1 → 1.35 섞기)·앞으로 커짐(02→03)을 한 식으로 — 장면 경계에서 속도가 꺾이지 않게
  const curtainK = cam => 1 - s6((cam - M.curtain.slide[0]) / (M.curtain.slide[1] - M.curtain.slide[0]));   // 1 = 첫 화면 자세, 0 = 02 자세
  function curtainPose(cam) {
    const [, C2, C3] = M.cam, c = M.curtain, k = curtainK(cam);
    const grow = 1 + M.ribbonGrow * s6((cam - C2) / (C3 - C2));
    return { x: c.p0.x * k, y: parB(cam, C2, 1, M.d.ribbonAfter, M.blend.ribbon) + c.p0.y * k, r: c.p0.r * k, s: (1 + (c.p0.s - 1) * k) * grow };
  }
  // 커튼 윤곽(루프 합집합, 원본 프레임 좌표) → 세계(3차 fit: 원본 (1101.84,656.52) ↦ (1616.84,1306.52), 회전 −12°·1.35)
  let OUT = null;
  fetch('assets/ribbon/ribbon-outline.json').then(r => r.json()).then(J => {
    const a = -12 * Math.PI / 180, c = Math.cos(a) * 1.35, s = Math.sin(a) * 1.35, n = J.pts.length / 2;
    OUT = new Float32Array(n * 2);
    for (let i = 0; i < n; i++) { const x = J.pts[2 * i] - 1101.84, y = J.pts[2 * i + 1] - 656.52; OUT[2 * i] = 1616.84 + c * x - s * y; OUT[2 * i + 1] = 1306.52 + s * x + c * y; }
  });
  const BR = { x: 328, top: 1346, lh: 54 };   // 문장 상자(세계): 4줄 × 54 (36px / 1.5)
  // 줄마다: 그 줄 높이 띠에 걸친 커튼 점 중 가장 왼쪽 x = 커튼 왼쪽 경계. 글자는 경계 − in 까지 또렷, 경계 + out 에서 0
  //   → 커튼 밑에서 글자가 나온다(글자는 커튼 위 레이어지만 경계 안쪽에선 녹아 있음). 띠에 커튼이 없으면 물러남 진행으로 판정.
  function revealBrand(CP, bY, outF, cam) {
    const n = T.brand.length, edges = new Array(n).fill(null);
    const k = curtainK(cam);
    if (OUT) {
      const a = CP.r * Math.PI / 180, c = Math.cos(a) * CP.s, s = Math.sin(a) * CP.s;
      const top = BR.top + bY;
      for (let i = 0; i < OUT.length; i += 2) {
        const dx = OUT[i] - RO[0], dy = OUT[i + 1] - RO[1];
        const li = Math.floor((RO[1] + CP.y + s * dx + c * dy - top) / BR.lh);
        if (li < 0 || li >= n) continue;
        const sx = RO[0] + CP.x + c * dx - s * dy;
        if (edges[li] === null || sx < edges[li]) edges[li] = sx;
      }
    }
    T.brand.forEach((el, i) => {
      const edge = edges[i] !== null ? edges[i] : (k < .5 ? 1e4 : -1e4);
      const e = edge - BR.x;
      const g = `linear-gradient(90deg,#000 ${fix(e - M.reveal.in)}px,transparent ${fix(e + M.reveal.out)}px)`;
      el.style.webkitMaskImage = g; el.style.maskImage = g;
    });
    L.brand.style.opacity = outF.toFixed(3);
  }

  let P = 0, Pt = 0, last = performance.now(), t0 = null;
  const fixT = qs.get('t') !== null ? parseFloat(qs.get('t')) : null;   // 검증: 로드 시각 고정
  let camNow = 0;
  window.__top = { get P() { return P; }, get cam() { return camNow; }, camAt, PMAX, M };
  function frame(now) {
    if (t0 === null) t0 = now;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const tl = fixT !== null ? fixT : (now - t0) / 1000;   // 로드 후 시간(s)
    Pt = clamp(scrollY / VH, 0, PMAX);
    P += (Pt - P) * (1 - Math.exp(-M.lambda * dt));
    if (Math.abs(Pt - P) < 1e-4) P = Pt;
    if (window.__P !== undefined) P = window.__P;            // 검증 훅

    // 카메라
    const [C0, C2, C3, C4] = M.cam;
    const cam = camNow = camAt(P);
    const drift = M.drift.amp * Math.sin(2 * Math.PI * tl / M.drift.period);

    // 하늘(d 1)
    ty(L.sky, -cam);
    // 위 구름(뒤, 0.8) + 흐름
    L.cTL.style.transform = `translate3d(${fix(drift)}px,${fix(par(cam, 0, M.d.cloudTop))}px,0)`;
    L.cTR.style.transform = `translate3d(${fix(-drift * .6)}px,${fix(par(cam, 0, M.d.cloudTop))}px,0)`;

    // 도트: 1.1. 로드 인트로 동안만 다시 그림
    if (!DOTS.done || (DOTW && cam < C3)) drawDots(tl);   // 반복 모션은 도트가 화면에 있는 동안(03 전까지) 매 프레임
    ty(L.dots, par(cam, 0, M.d.dots));

    // 모델: 01→02 는 하늘과 같이(1), 02 뒤로는 1.1 로 위로 빠짐. 로드: 아래 36px 에서 떠오름
    const mE = expoOut(clamp((tl - M.load.model[0]) / M.load.model[1], 0, 1));
    const mY = parB(cam, C2, 1, M.d.modelAfter, M.blend.model);   // 8차: 깊이 1 → 1.1 을 02 지나며 섞음
    // 10차(사장님 '스크롤되서 내려올 때 모델이 잘려 보이니 이상 — 자연스럽게 알파로 사라지게'): 얼굴이 화면 위로 빠지기 시작하면(cam mFade[0]) 서서히 투명, 목·어깨만 남기 전에(mFade[1]) 0. ?mfade=0 끔
    const mF = M.mFade ? 1 - s6((cam - M.mFade[0]) / (M.mFade[1] - M.mFade[0])) : 1;
    ty(L.model, mY + (1 - mE) * M.load.model[2]); L.model.style.opacity = (mE * mF).toFixed(3);
    ty(L.ell, mY + (1 - mE) * M.load.model[2]); L.ell.style.opacity = (mE * mF).toFixed(3);   // Ellipse 1 = 몸의 그늘, 모델과 한 몸

    // 01 글자: 로드 순차("산소 ON," → 한 박자 뒤 "ibex"), 스크롤엔 1.25 로 앞서 올라감
    ty(L.hero, par(cam, 0, M.d.hero));
    T.hero.forEach((el, k) => {
      const e = quartOut((tl - M.load.hero[0] - k * M.load.heroGap) / M.load.hero[1]);
      el.style.opacity = e.toFixed(3); el.style.transform = `translate3d(0,${fix((1 - e) * M.load.hero[2])}px,0)`;
    });

    // 리본(커튼): 01→02 = 첫 화면 자세 → 멈춤 02 자세(오른쪽으로 물러남). 02→03 = 3차 그대로(1.35 로 위로, 앞으로 18% 커짐)
    const CP = curtainPose(cam);
    ribbon.style.transform = `translate3d(${fix(CP.x)}px,${fix(CP.y)}px,0) rotate(${CP.r.toFixed(3)}deg) scale(${CP.s.toFixed(4)})`;

    // 02 문장: 1.15, 멈춤 02 직전(.85)에 창이 열림. 02→03 앞부분에 위로 빠지며 흐려짐
    const bY = par(cam, C2, M.d.brand);
    ty(L.brand, bY);
    revealBrand(CP, bY, 1 - ss(M.brandFade[0], M.brandFade[1], cam), cam);

    // 아래 구름: 02→03 은 1.25 로 떠오름. 다리에선 화면에 거의 머문 채(위로 M.cloudLift 만) 걷힌다 — 그 뒤에서 호가 올라와 구름 윗선 자리에 선다
    const bu = camU(cam, C3, C4);
    const wB = M.blend.cloudB, cBY = parB(cam, C3, M.d.cloudB, wB[2], wB);   // 8차: 1.25 → .03 을 03 지나며 섞음 — 다리에선 화면에 거의 머문 채 걷힌다(멈춤 없이)
    L.cB.style.transform = `translate3d(${fix(drift * .5)}px,${fix(cBY)}px,0)`;
    L.cB.style.opacity = (1 - ss(M.cloudBridgeFade[0], M.cloudBridgeFade[1], bu)).toFixed(3);

    // 03 글자
    const nY = parB(cam, C3, M.d.now, M.d.nowBridge, M.blend.now);
    ty(L.now, nY);
    // 5차(사장님 '구름이 등장할 때부터 서서히 한 줄씩'): 시간 게이트 대신 스크롤 창 — 02→03 구간 안에서 줄마다 [시작, 끝](segU(3) 기준). ?now=old 이전(03 멈춤 직전 시간 순차)
    const u3 = (cam - C2) / (C3 - C2);   // 02→03 진행(카메라 기준)
    if (M.nowOld) seqText('now', T.now, u3 >= .92, now / 1000, 1 - ss(0, .3, bu));
    else if (!M.now5) {   // 6차(사장님 '첫 타이틀과 같은 등장모션, 더 위에서 먼저, 배경과 시간차 두고 하단 끝까지 가면 원래 위치로 딱')
      const open = u3 >= M.nowOpen, tN = now / 1000;   // 8차: 창 = 카메라 기준 그대로(.42), 끝 장면까지 열린 채
      if (open && gate.now === null) gate.now = tN; if (!open) gate.now = null;
      const nOut = 1 - ss(0, .3, bu);
      T.now.forEach((el, k) => { const e = gate.now === null ? 0 : quartOut((tN - gate.now - k * M.load.heroGap) / M.load.hero[1]);
        el.style.opacity = (e * nOut).toFixed(3); el.style.transform = `translate3d(0,${fix((1 - e) * M.load.hero[2])}px,0)`; }); }
    else { const nOut = 1 - ss(0, .3, bu);
      T.now.forEach((el, k) => { const w = M.nowWin[k] || M.nowWin[M.nowWin.length - 1], e = s6(clamp((u3 - w[0]) / (w[1] - w[0]), 0, 1));
        el.style.opacity = (e * nOut).toFixed(3); el.style.transform = `translate3d(0,${fix((1 - e) * M.text.rise)}px,0)`; }); }

    // 다리: 호 1·2 — 화면 기준(카메라 무관)으로 아래에서 올라와 특장점 OXYGEN 자세(MEAS)에 선다. 구름 뒤라 처음엔 가려져 있다가 구름이 걷히며 드러남.
    //       큰 호가 먼저·빠르게, 작은 호가 늦게(특장점 로드 문법). arcs 컨테이너는 세계 3204 에 있으므로 화면 기준 = −C4 + 오프셋
    arcs.forEach(a => {
      const e = s6((bu - a.win[0]) / (a.win[1] - a.win[0]));
      a.el.style.transform = `translate3d(0,${fix(-C4 + a.from * (1 - e))}px,0)`;
      a.el.style.opacity = cam > C3 ? '1' : '0';
    });
    // 04 글자(이음 확인용): 다리 끝 .85 에 창
    ty(L.ox, -cam);
    seqText('ox', T.ox, bu >= .9, now / 1000, 1);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // 첫 프레임 쓰고 나서 보이기(등장 전 상태가 한 번 깜빡이지 않게)
  requestAnimationFrame(() => requestAnimationFrame(ready));
})();

</script>
</body>
</html>
